<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Голосовой ввод</title>
  <link rel="stylesheet" href="vendor/ui-kit/tokens.css">
  <link rel="stylesheet" href="vendor/ui-kit/components/demo-frame/demo-frame.css">
  <link rel="stylesheet" href="vendor/ui-kit/components/toolbar/toolbar.css">
  <link rel="stylesheet" href="vendor/ui-kit/components/close-button/close-button.css">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/demo-frame.css?v=system-area">
  <link rel="stylesheet" href="css/scene-background.css">
  <link rel="stylesheet" href="css/voice-toolbar.css">
  <script defer src="vendor/ui-kit/components/demo-frame/demo-frame.js"></script>
  <script defer src="js/demo-frame.js?v=system-area"></script>
</head>
<body>
  <div class="demo-canvas" id="demo-canvas">
    <main class="demo-stage" id="demo-stage" aria-label="Сцена демо">
      <div class="scene-background" aria-hidden="true">
        <div class="scene-background__navigation">
          <div class="scene-background__brand">
            <span class="scene-background__logo"><img src="assets/scene/logo.svg" alt=""></span>
            <img src="assets/scene/wordmark.svg" alt="">
            <img class="scene-background__navigation-arrow" src="assets/scene/navigation-arrow.svg" alt="">
          </div>
          <div class="scene-background__menu">
            <img src="assets/scene/menu.svg" alt="">
            <span>Предприятие</span>
          </div>
          <div class="scene-background__items">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
        <div class="scene-background__workspace">
          <div class="scene-background__placeholder"></div>
          <div class="scene-background__surface"></div>
        </div>
        <div class="scene-background__task">
          <div class="scene-background__task-body">
            <img src="assets/scene/task-panel.png" alt="">
            <div class="scene-background__caret"></div>
          </div>
          <div class="scene-background__toolbar">
            <div class="scene-background__tools">
              <span class="scene-background__circle"><img src="assets/scene/close.svg" alt=""></span>
              <div class="scene-background__actions">
                <span><img src="assets/scene/settings.svg" alt=""></span>
                <span><img src="assets/scene/list.svg" alt=""></span>
                <span><img src="assets/scene/share.svg" alt=""></span>
                <span><img src="assets/scene/edit.svg" alt=""></span>
                <span><img src="assets/scene/more.svg" alt=""></span>
              </div>
            </div>
            <div class="scene-background__informers">
              <span class="scene-background__circle scene-background__date">16 <small>чт</small></span>
              <span class="scene-background__circle"><img src="assets/scene/phone.svg" alt=""></span>
              <span class="scene-background__circle"><img src="assets/scene/chat.svg" alt=""></span>
              <span class="scene-background__circle scene-background__help"><img src="assets/scene/help.svg" alt=""></span>
            </div>
          </div>
        </div>
      </div>
      <div class="tb tb--style-info voice-toolbar" id="voice-toolbar" role="toolbar" aria-label="Панель редактора">
        <div class="voice-toolbar__actions">
          <button type="button" class="tb__btn voice-toolbar__text-style" disabled>
            <span class="tb__caption">Текст</span>
            <span class="tb__arrow" aria-hidden="true"></span>
          </button>
          <button type="button" class="tb__btn" aria-label="Свойства текста" disabled>
            <span class="tb__icon" aria-hidden="true">&#xe764;</span>
          </button>
          <span class="tb__sep" aria-hidden="true"></span>
          <button type="button" class="tb__btn" aria-label="Маркированный список" disabled>
            <span class="tb__icon" aria-hidden="true">&#xe6c7;</span>
          </button>
          <button type="button" class="tb__btn" aria-label="Нумерованный список" disabled>
            <span class="tb__icon" aria-hidden="true">&#xe6c8;</span>
          </button>
          <button type="button" class="tb__btn" aria-label="Чек-лист" disabled>
            <span class="tb__icon" aria-hidden="true">&#xe76f;</span>
          </button>
          <button type="button" class="tb__btn" aria-label="Ссылка" disabled>
            <span class="tb__icon" aria-hidden="true">&#xe6a7;</span>
          </button>
          <button type="button" class="tb__btn" aria-label="Фото" disabled>
            <span class="tb__icon" aria-hidden="true">&#xe9a3;</span>
          </button>
          <button type="button" class="tb__btn" aria-label="Таблица" disabled>
            <span class="tb__icon" aria-hidden="true">&#xe958;</span>
          </button>
          <button type="button" class="tb__btn" aria-label="Колонки" disabled>
            <span class="tb__icon" aria-hidden="true">&#xeaee;</span>
          </button>
          <button type="button" class="tb__btn" aria-label="Эмодзи" disabled>
            <span class="tb__icon" aria-hidden="true">&#xe9a7;</span>
          </button>
          <button type="button" class="tb__btn" aria-label="Код" disabled>
            <span class="tb__icon" aria-hidden="true">&#xea88;</span>
          </button>
          <button type="button" class="tb__btn" aria-label="Видео" disabled>
            <span class="tb__icon" aria-hidden="true">&#xe929;</span>
          </button>
          <span class="tb__sep" aria-hidden="true"></span>
          <button type="button" class="tb__btn" aria-label="Голосовой ввод" disabled>
            <span class="tb__icon" aria-hidden="true">&#xe9b1;</span>
          </button>
          <button type="button" class="tb__btn" aria-label="SabyGPT" disabled>
            <span class="voice-toolbar__assistant"><img src="assets/voice-toolbar/assistant.svg" alt=""></span>
          </button>
          <button type="button" class="tb__btn" aria-label="Ещё" disabled>
            <span class="tb__icon" aria-hidden="true">&#xeab4;</span>
          </button>
        </div>
        <button type="button" class="close-button close-button--link-button voice-toolbar__close" aria-label="Закрыть панель редактора">
          <img src="assets/voice-toolbar/close.svg" alt="">
        </button>
      </div>
      <section class="voice-window" data-voice-scenario="radio-buttons" aria-label="Окно голосового ввода" hidden>
        <div class="voice-window__toolbar">
          <span class="voice-window__radio" aria-hidden="true"></span>
          <time class="voice-window__timer" datetime="PT12S">0:12</time>
          <span class="voice-window__waveform" aria-hidden="true"></span>
          <div class="voice-window__actions">
            <span class="voice-window__icon" aria-label="Пауза" role="img"><span aria-hidden="true">&#xE639;</span></span>
            <span class="voice-window__icon" aria-label="Начать заново" role="img"><span aria-hidden="true">&#xE629;</span></span>
            <span class="voice-window__insert">Вставить текст</span>
          </div>
          <span class="voice-window__close" aria-label="Закрыть" role="img"></span>
        </div>
        <p class="voice-window__transcript">
          <span class="voice-window__radio voice-window__radio--selected" aria-hidden="true"></span>
          <span>нужно отрисовать объединенный механизм голосового ввода и отправки аудиосообщения также нужно добавить возможность голосового ввода в любое поле на сайте по шорткату</span>
        </p>
      </section>
    </main>
  </div>
</body>
</html>
